<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tech Asar - ONE UI VIEWER</title>
<meta name="color-scheme" content="light dark">

<style>
    /* =========================================
       1. ONE UI CORE VARIABLES
       ========================================= */
    :root { 
        --vh: 1vh; 
        --primary: #007aff; --primary-soft: rgba(0, 122, 255, 0.15);
        --success: #34c759; --success-soft: rgba(52, 199, 89, 0.15);
        --warning: #ff9500; --warning-soft: rgba(255, 149, 0, 0.15);
        --danger: #ff3b30;  --danger-soft: rgba(255, 59, 48, 0.15);
        
        --bg-main: #f2f2f7; --card-bg: #ffffff; 
        --text-main: #000000; --text-sub: #8e8e93; 
        --nav-bg: rgba(255, 255, 255, 0.85); --glass-border: rgba(0, 0, 0, 0.05);
        
        --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        --app-launch: cubic-bezier(0.2, 0.8, 0.2, 1); 
    }
    
    html.dark-mode { 
        --bg-main: #000000; --card-bg: #1c1c1e; 
        --text-main: #ffffff; --text-sub: #98989d; 
        --nav-bg: rgba(30, 30, 30, 0.85); --glass-border: rgba(255, 255, 255, 0.05);
        color-scheme: dark; 
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-font-smoothing: antialiased; }
    body { height: 100vh; height: calc(var(--vh, 1vh) * 100); width: 100%; overflow: hidden; background-color: var(--bg-main); color: var(--text-main); transition: background-color 0.4s ease; }
    
    /* Background Design */
    .bg-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% -20%, var(--primary-soft), transparent 60%); z-index: -1; pointer-events: none; }
    
    #app { width: 100%; max-width: 500px; height: 100%; position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; overflow: hidden; }
    
    /* =========================================
       2. ONE UI LAYOUT & NAVIGATION
       ========================================= */
    /* One UI Large Header Area */
    .one-ui-header { padding: max(env(safe-area-inset-top), 40px) 24px 20px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-end;}
    .one-ui-header h1 { font-size: 34px; font-weight: 800; letter-spacing: -1px; color: var(--text-main); line-height: 1.1; transition: color 0.4s ease;}
    .live-badge { display: flex; align-items: center; gap: 6px; background: var(--success-soft); color: var(--success); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: 1px;}
    .live-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Sections */
    .section-container { flex: 1; position: relative; width: 100%; overflow: hidden; }
    .section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 0 20px calc(env(safe-area-inset-bottom) + 110px); opacity: 0; visibility: hidden; transition: opacity 0.4s var(--app-launch), transform 0.4s var(--app-launch), visibility 0.4s; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; will-change: opacity, transform, visibility; }
    .section.active { opacity: 1; visibility: visible; transform: translate3d(0,0,0); z-index: 10; }
    .section.slide-left { transform: translate3d(-40px, 0, 0); } .section.slide-right { transform: translate3d(40px, 0, 0); } .section::-webkit-scrollbar { display: none; }
    
    /* Centered Wrapper for Dashboard */
    .center-wrapper { display: flex; flex-direction: column; justify-content: center; flex: 1; min-height: 65vh; padding-bottom: 40px;}

    /* Floating Pill Nav */
    .floating-nav { position: absolute; bottom: max(env(safe-area-inset-bottom), 24px); left: 50%; transform: translateX(-50%); background: var(--nav-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 32px; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; width: 90%; z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); cursor: pointer; transition: color 0.3s; padding: 8px; flex: 1;}
    .nav-item.active { color: var(--primary); }
    .nav-item span { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;}
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; transition: transform 0.4s var(--spring); }
    .nav-item.active svg { transform: scale3d(1.15, 1.15, 1) translate3d(0,-3px,0); }

    /* =========================================
       3. ONE UI DASHBOARD CARDS
       ========================================= */
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%;}
    .stat-card { border-radius: 28px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; background: var(--card-bg); box-shadow: 0 8px 20px rgba(0,0,0,0.04); border: 1px solid var(--glass-border); aspect-ratio: 1 / 1; }
    .stat-icon { width: 44px; height: 44px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: auto;}
    .stat-icon svg { width: 22px; height: 22px; }
    
    .c-cust .stat-icon { background: var(--primary-soft); color: var(--primary); }
    .c-rev .stat-icon { background: var(--success-soft); color: var(--success); }
    .c-pend .stat-icon { background: var(--warning-soft); color: var(--warning); }
    .c-exp .stat-icon { background: var(--danger-soft); color: var(--danger); }

    .stat-info h4 { font-size: 12px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;}
    .stat-info h2 { font-size: 26px; font-weight: 900; color: var(--text-main); font-variant-numeric: tabular-nums; letter-spacing: -0.5px;}

    /* =========================================
       4. LIST VIEWS & SEARCH
       ========================================= */
    .search-bar { display: flex; align-items: center; background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); } 
    .search-bar svg { fill: var(--text-sub); width: 20px; height: 20px; margin-right: 12px; } 
    .search-bar input { border: none; background: transparent; outline: none; font-size: 16px; font-weight: 600; width: 100%; color: var(--text-main); }
    
    .empty-state { text-align: center; color: var(--text-sub); font-size: 14px; font-weight: 700; margin-top: 40px; padding: 40px; background: rgba(142, 142, 147, 0.05); border-radius: 28px; }
    
    .view-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    .card-content { flex: 1; }
    .card-content h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; color: var(--text-main); letter-spacing: -0.2px;}
    .card-meta { font-size: 12px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; line-height: 1.5; letter-spacing: 0.2px;}
    
    .card-value { text-align: right; min-width: 90px; }
    .card-value .amt { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .card-value .sub { font-size: 11px; font-weight: 800; margin-top: 4px; text-transform: uppercase;}
    
    /* Settings / Print Buttons */
    .setting-card { background: var(--card-bg); border-radius: 24px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border: 1px solid var(--glass-border); box-shadow: 0 4px 15px rgba(0,0,0,0.02);}
    .setting-card span { font-size: 15px; font-weight: 800; text-transform: uppercase; color: var(--text-main); }
    
    .big-print-btn { width: 100%; padding: 20px; border-radius: 24px; background: var(--card-bg); border: 1px solid var(--glass-border); color: var(--text-main); font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; transition: transform 0.2s; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.02);}
    .big-print-btn:active { transform: scale3d(0.96, 0.96, 1); }
    .big-print-btn svg { width: 24px; height: 24px; }
    .big-print-btn.btn-cust { color: var(--primary); background: var(--primary-soft); border: none;}
    .big-print-btn.btn-staff { color: var(--warning); background: var(--warning-soft); border: none;}
    .big-print-btn.btn-exp { color: var(--danger); background: var(--danger-soft); border: none;}
    
    .ios-switch { position: relative; display: inline-block; width: 50px; height: 28px; } .ios-switch input { opacity: 0; width: 0; height: 0; } .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(142, 142, 147, 0.3); transition: .4s; border-radius: 34px; } .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); } input:checked + .slider { background-color: var(--primary); } input:checked + .slider:before { transform: translate3d(22px,0,0); }

    /* Toast */
    #toast { position: absolute; top: -60px; left: 50%; transform: translate3d(-50%, 0, 0); background: var(--text-main); color: var(--bg-main); padding: 14px 28px; border-radius: 30px; font-size: 13px; font-weight: 800; z-index: 9999; transition: transform 0.4s var(--spring); display: flex; align-items: center; gap: 8px; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    #toast.show { transform: translate3d(-50%, calc(max(env(safe-area-inset-top), 50px)), 0); }

    /* =========================================
       5. FIX: EXACT MATCH PRINT CSS (NO DARK MODE BUGS)
       ========================================= */
    #export-container { display: none; }
    
    @media print {
        /* FIX: Overriding dark mode entirely for print */
        :root, html, body { background-color: #ffffff !important; color: #000000 !important; }
        html.dark-mode { background-color: #ffffff !important; color: #000000 !important; }
        
        body * { visibility: hidden; }
        #app, .bg-mesh, .floating-nav, .one-ui-header { display: none !important; }
        
        /* Force explicit colored backgrounds for printing */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            color-adjust: exact !important;
        }
        
        #export-container { 
            display: block !important; position: absolute; left: 0; top: 0; 
            width: 100% !important; margin: 0; padding: 0; 
            visibility: visible; background: #ffffff !important; z-index: 99999;
        }
        #export-container * { visibility: visible; }
        
        /* Set to landscape to fit all columns exactly like the image */
        @page { size: A4 landscape; margin: 10mm; } 
        
        .print-view { 
            width: 100%; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
            color: #000 !important; box-sizing: border-box; text-align: center;
        }
        
        .report-title { font-size: 26px !important; font-weight: 900 !important; margin-bottom: 25px !important; text-transform: uppercase; color: #000 !important;}
        
        .print-table { width: 100%; border-collapse: collapse; font-size: 13px !important; table-layout: fixed;}
        .print-table th, .print-table td { border: 2px solid #e5e7eb !important; padding: 12px 6px !important; text-align: center; word-wrap: break-word;}
        
        .print-table th { color: #ffffff !important; font-weight: 800 !important; text-transform: uppercase; }
        
        /* Exact Colors from User's Screenshots */
        .th-blue th { background-color: #0d6efd !important; border-color: #0d6efd !important; }
        .th-gold th { background-color: #d97706 !important; border-color: #d97706 !important; }
        .th-red th { background-color: #dc2626 !important; border-color: #dc2626 !important; }
        
        /* Text Colors inside table */
        .txt-blue { color: #0d6efd !important; font-weight: 800 !important;}
        .txt-green { color: #16a34a !important; font-weight: 800 !important;}
        .txt-red { color: #dc2626 !important; font-weight: 800 !important;}
        .txt-bold { font-weight: 800 !important; color: #000 !important;}
        
        .grand-total td { background-color: #f8f9fa !important; font-weight: 900 !important; color: #000 !important;}
    }
</style>
</head>
<body>
<div class="bg-mesh"></div>

<div id="app">
    <div id="toast">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
        <span id="toast-msg">SUCCESS</span>
    </div>

    <!-- ONE UI DYNAMIC HEADER -->
    <div class="one-ui-header">
        <h1 id="page-title">Dashboard</h1>
        <div class="live-badge"><div class="live-dot"></div> LIVE</div>
    </div>

    <div class="section-container">
        <!-- TAB 1: DASHBOARD -->
        <div id="sec1" class="section active">
            <div class="center-wrapper">
                <div class="dash-grid">
                    <div class="stat-card c-cust">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                        </div>
                        <div class="stat-info">
                            <h4>Clients</h4>
                            <h2 id="dash-cust">0</h2>
                        </div>
                    </div>

                    <div class="stat-card c-rev">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>

                            <h2 id="dash-rev">₹0</h2>

                    </div>

                    <div class="stat-card c-pend">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
                        </div>
                        <div class="stat-info">
                            <h4>Pending</h4>
                            <h2 id="dash-pend">₹0</h2>
                        </div>
                    </div>

                    <div class="stat-card c-exp">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm16 16H5V5h14v14zM11 7h2v4h4v2h-6V7z"/></svg>
                        </div>
                        <div class="stat-info">
                            <h4>Expenses</h4>
                            <h2 id="dash-exp">₹0</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: CLIENTS -->
        <div id="sec2" class="section">
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="search-cust" placeholder="Search Ledgers..." oninput="renderCustomers()">
            </div>
            <div id="customer-list"></div>
        </div>

        <!-- TAB 3: STAFF -->
        <div id="sec3" class="section">
            <div id="worker-list"></div>
        </div>

        <!-- TAB 4: EXPENSES -->
        <div id="sec4" class="section">
            <div id="expense-list"></div>
        </div>

        <!-- TAB 5: PRINT & SETTINGS -->
        <div id="sec5" class="section">
            <div class="setting-card">
                <span>DARK MODE</span>

                    <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode()">

            <button class="big-print-btn btn-cust" onclick="exportDataPrint('customers')">

            </button>
            <button class="big-print-btn btn-staff" onclick="exportDataPrint('workers')">
                PRINT STAFF RECORD
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>

            </button>

    <!-- FLOATING PILL NAV -->
    <nav class="floating-nav">
        <div class="nav-item active" onclick="switchTab(1, 'Dashboard', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>HOME</span>
        </div>
        <div class="nav-item" onclick="switchTab(2, 'Ledgers', this)">

<!-- PRINT CONTAINER -->
<div id="export-container"></div>

<!-- CLOUD FIRESTORE INTEGRATION -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATj9_cJpq0aWsUqqLzPSC-SWPtBuEagwc",
      authDomain: "gulfamlabs.firebaseapp.com",
      projectId: "gulfamlabs",
      storageBucket: "gulfamlabs.firebasestorage.app",
      messagingSenderId: "447195095179",
      appId: "1:447195095179:web:76304c5238cb16493ff48e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, 'appData', 'techAsar'); 

    window.appData = { customers: [], workers: [], expenses: [], settings: { darkMode: false } };

    // PERFECT REAL-TIME FETCH
    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const val = docSnap.data();
            window.appData = {
                customers: val.customers || [],
                workers: val.workers || [],
                expenses: val.expenses || [],
                settings: val.settings || window.appData.settings
            };
            requestAnimationFrame(() => {
                window.updateDashboard(); 
                window.renderCustomers(); 
                window.renderWorkers(); 
                window.renderExpenses();
            });
        }
    });

    window.toggleDarkMode = function() {
        let isDark = document.getElementById('dark-mode-toggle').checked;
        if(isDark) document.documentElement.classList.add('dark-mode');
        else document.documentElement.classList.remove('dark-mode');
    };

    function lockMobileHeight() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
    window.addEventListener('resize', lockMobileHeight); lockMobileHeight();
    
    document.querySelectorAll('.section').forEach(s => { let id = parseInt(s.id.replace('sec', '')); if (id > 1) s.classList.add('slide-right'); });

    window.showToast = function(msg) { 
        const toast = document.getElementById('toast'); 
        document.getElementById('toast-msg').innerText = msg.toUpperCase(); 
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                toast.classList.add('show'); 
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        });
    };
    
    // One UI Tab Switching logic with Title Update
    window.switchTab = function(tabId, title, el) { 
        // Update Title
        const titleEl = document.getElementById('page-title');
        titleEl.style.opacity = '0';
        setTimeout(() => { titleEl.innerText = title; titleEl.style.opacity = '1'; }, 200);

        document.querySelectorAll('.section').forEach(s => { 
            let id = parseInt(s.id.replace('sec', '')); 
            s.classList.remove('active', 'slide-left', 'slide-right'); 
            if (id < tabId) s.classList.add('slide-left'); else if (id > tabId) s.classList.add('slide-right'); 
        }); 
        document.getElementById('sec' + tabId).classList.remove('slide-left', 'slide-right'); 
        document.getElementById('sec' + tabId).classList.add('active'); 
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); 
        el.classList.add('active'); 
    };

    window.countUpAnimation = function(element, start, end, duration, prefix = "") { 
        let startTimestamp = null; 
        const step = (timestamp) => { 
            if (!startTimestamp) startTimestamp = timestamp; 
            const progress = Math.min((timestamp - startTimestamp) / duration, 1); 
            const easeProgress = 1 - Math.pow(1 - progress, 3); 
            element.innerText = prefix + Math.floor(easeProgress * (end - start) + start).toLocaleString('en-IN'); 
            if (progress < 1) window.requestAnimationFrame(step); else element.innerText = prefix + end.toLocaleString('en-IN'); 
        }; 
        window.requestAnimationFrame(step); 
    };

    window.updateDashboard = function() {
        let totalRev = 0, totalPend = 0, totalExp = 0; 
        window.appData.customers.forEach(c => { totalRev += c.total; totalPend += c.pending; }); 
        window.appData.expenses.forEach(e => { totalExp += e.amount; });
        
        countUpAnimation(document.getElementById('dash-cust'), 0, window.appData.customers.length, 1000); 
        countUpAnimation(document.getElementById('dash-rev'), 0, totalRev, 1000, "₹"); 
        countUpAnimation(document.getElementById('dash-pend'), 0, totalPend, 1000, "₹"); 
        countUpAnimation(document.getElementById('dash-exp'), 0, totalExp, 1000, "₹"); 
    };

    window.renderCustomers = function() { 
        const search = document.getElementById('search-cust') ? document.getElementById('search-cust').value.toLowerCase() : ''; 
        const list = document.getElementById('customer-list'); let htmlBatch = ''; 
        
        let filtered = window.appData.customers.filter(c => c.name.toLowerCase().includes(search) || c.mobile.includes(search));
        if(filtered.length === 0) { list.innerHTML = '<div class="empty-state">No ledgers found</div>'; return; }
        
        filtered.slice().reverse().forEach(c => { 
            htmlBatch += `
                <div class="view-card">
                    <div class="card-content">
                        <h3>${c.name}</h3>
                        <div class="card-meta">QTY: ${c.qty} | ITEM: ${c.item}<br>DATE: ${c.date}</div>
                    </div>
                    <div class="card-value">
                        <div class="amt" style="color:var(--primary);">₹${c.total.toLocaleString('en-IN')}</div>
                        <div class="sub" style="color:var(--danger);">PENDING: ₹${c.pending.toLocaleString('en-IN')}</div>
                    </div>
                </div>`; 
        }); 
        list.innerHTML = htmlBatch; 
    };

    window.renderWorkers = function() { 
        const list = document.getElementById('worker-list'); let htmlBatch = ''; 
        if(window.appData.workers.length === 0) { list.innerHTML = '<div class="empty-state">No staff found</div>'; return; }
        
        window.appData.workers.forEach(w => { 
            let sColor = w.status === 'PRESENT' ? 'var(--success)' : w.status === 'HALF DAY' ? 'var(--warning)' : w.status === 'ABSENT' ? 'var(--danger)' : 'var(--text-sub)'; 
            let timeInfo = (w.timeIn || w.timeOut) ? `${w.timeIn || '--'} to ${w.timeOut || '--'}` : 'NO TIME LOGGED';
            
            htmlBatch += `
                <div class="view-card">
                    <div class="card-content">
                        <h3>${w.name}</h3>
                        <div class="card-meta" style="color:${sColor}; font-weight:800;">${w.status} <span style="color:var(--text-sub); font-weight:700;">| ${w.date}</span></div>
                    </div>
                    <div class="card-value">
                        <div class="amt" style="font-size:14px; color:var(--text-main);">${timeInfo}</div>
                        <div class="sub" style="color:var(--primary);">ADV: ₹${w.advance.toLocaleString('en-IN')}</div>
                    </div>
                </div>`; 
        }); 
        list.innerHTML = htmlBatch; 
    };

    window.renderExpenses = function() { 
        const list = document.getElementById('expense-list'); let htmlBatch = ''; 
        let exps = [...window.appData.expenses].sort((a,b) => b.id - a.id); 
        if(exps.length === 0) { list.innerHTML = '<div class="empty-state">No expenses found</div>'; return; }
        
        exps.forEach(e => { 
            htmlBatch += `
                <div class="view-card">
                    <div class="card-content">
                        <h3>${e.type}</h3>
                        <div class="card-meta">${e.date}</div>
                    </div>
                    <div class="card-value">
                        <div class="amt" style="color:var(--danger);">-₹${e.amount.toLocaleString('en-IN')}</div>
                    </div>
                </div>`; 
        }); 
        list.innerHTML = htmlBatch; 
    };

    /* ==============================================
       EXACT MATCH PRINT LOGIC (Matches Image Arrays)
       ============================================== */
    window.triggerPrint = function(contentHTML) {
        const container = document.getElementById('export-container');
        container.innerHTML = contentHTML;
        setTimeout(() => { window.print(); }, 300);
    };

    window.formatTimeAMPM = function(timeStr) { if(!timeStr) return '--'; let [h, m] = timeStr.split(':'); let hours = parseInt(h); let ampm = hours >= 12 ? 'PM' : 'AM'; hours = hours % 12; hours = hours ? hours : 12; return `${hours}:${m} ${ampm}`; };

    window.exportDataPrint = function(type) { 
        let tableHTML = ''; let title = ''; let theadClass = '';
        
        if(type === 'customers') { 
            title = 'CUSTOMER RECORDS EXPORT'; 
            theadClass = 'th-blue';
            tableHTML += `<thead class="${theadClass}"><tr><th>DATE</th><th>NAME</th><th>MOBILE</th><th>ITEM</th><th>QTY</th><th>RATE</th><th>TOTAL AMT</th><th>RECEIVED</th><th>PENDING</th></tr></thead><tbody>`; 
            let tQty=0, tTotal=0, tRecv=0, tPend=0; 
            window.appData.customers.forEach(c => { 
                tableHTML += `<tr><td>${c.date}</td><td class="txt-bold">${c.name}</td><td>${c.mobile}</td><td class="txt-bold">${c.item}</td><td>${c.qty}</td><td>${c.rate}</td><td class="txt-blue">${c.total}</td><td class="txt-green">${c.advance}</td><td class="txt-red">${c.pending}</td></tr>`; 
                tQty+=c.qty; tTotal+=c.total; tRecv+=c.advance; tPend+=c.pending; 
            }); 
            tableHTML += `<tr class="grand-total"><td colspan="4" class="text-right">GRAND TOTAL:</td><td class="txt-blue">${tQty}</td><td></td><td class="txt-blue">${tTotal}</td><td class="txt-green">${tRecv}</td><td class="txt-red">${tPend}</td></tr></tbody>`; 
        } 
        else if(type === 'workers') { 
            title = 'WORKERS ATTENDANCE EXPORT'; 
            theadClass = 'th-gold';
            tableHTML += `<thead class="${theadClass}"><tr><th>DATE</th><th>NAME</th><th>STATUS</th><th>TIME IN</th><th>TIME OUT</th><th>ADVANCE</th></tr></thead><tbody>`; 
            window.appData.workers.forEach(w => { 
                let sColorClass = w.status === 'PRESENT' ? 'txt-green' : w.status === 'HALF DAY' ? 'txt-gold' : w.status === 'ABSENT' ? 'txt-red' : '';
                tableHTML += `<tr><td>${w.date}</td><td>${w.name}</td><td class="${sColorClass}">${w.status}</td><td>${window.formatTimeAMPM(w.timeIn)}</td><td>${window.formatTimeAMPM(w.timeOut)}</td><td class="txt-blue">${w.advance}</td></tr>`; 
            }); 
            tableHTML += '</tbody>';
        } 
        else if(type === 'expenses') { 
            title = 'EXPENSES RECORDS EXPORT'; 
            theadClass = 'th-red';
            tableHTML += `<thead class="${theadClass}"><tr><th>DATE</th><th>EXPENSE TYPE</th><th>AMOUNT (₹)</th></tr></thead><tbody>`; 
            let tAmt=0; 
            window.appData.expenses.forEach(e => { tableHTML += `<tr><td>${e.date}</td><td class="txt-bold">${e.type}</td><td class="txt-red">${e.amount}</td></tr>`; tAmt+=e.amount; }); 
            tableHTML += `<tr class="grand-total"><td colspan="2" class="text-right">TOTAL EXPENSES:</td><td class="txt-red">${tAmt}</td></tr></tbody>`; 
        } 
        
        triggerPrint(`<div class="print-view"><div class="report-title">${title}</div><table class="print-table">${tableHTML}</table></div>`); 
    };
</script>
</body>
