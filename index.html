<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tech Asar - PRO VIEWER</title>
<meta name="color-scheme" content="light">

<style>
    /* =========================================
       1. PROFESSIONAL PREMIUM VARIABLES
       ========================================= */
    :root { 
        --vh: 1vh; 
        --primary: #2563EB; 
        --success: #059669; 
        --warning: #D97706; 
        --danger:  #DC2626; 
        
        /* PURE WHITE THEME */
        --bg-main: #FFFFFF; 
        --card-bg: #FFFFFF; 
        --text-main: #0F172A; 
        --text-sub: #64748B; 
        --nav-bg: rgba(255, 255, 255, 0.98); 
        --glass-border: rgba(0, 0, 0, 0.08);
        --box-bg: #F8FAFC; 
        
        /* WHATSAPP STYLE SMOOTH SLIDE CURVE */
        --spring: cubic-bezier(0.25, 1, 0.5, 1); 
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-font-smoothing: antialiased; text-transform: uppercase; }
    
    body { height: 100vh; height: calc(var(--vh, 1vh) * 100); width: 100%; overflow: hidden; background-color: var(--bg-main); color: var(--text-main); }
    
    #app { width: 100%; max-width: 500px; height: 100%; position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg-main); }
    
    /* =========================================
       2. WHATSAPP-STYLE HORIZONTAL SWIPE TAB
       ========================================= */
    .section { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        padding: max(env(safe-area-inset-top), 15px) 20px calc(env(safe-area-inset-bottom) + 85px); 
        background-color: var(--bg-main);
        
        /* EXACT WHATSAPP SLIDE: No fade, full 100% left/right translation */
        visibility: hidden; pointer-events: none;
        transition: transform 0.35s var(--spring), visibility 0s linear 0.35s; 
        
        display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; 
        will-change: transform; 
        z-index: 1;
    }
    
    .section.active { 
        visibility: visible; pointer-events: auto;
        transform: translate3d(0, 0, 0); 
        z-index: 10; 
        transition: transform 0.35s var(--spring), visibility 0s linear 0s; 
    }
    
    /* Outgoing tab goes 100% left, Incoming tab comes from 100% right */
    .section.slide-left { transform: translate3d(-100%, 0, 0); } 
    .section.slide-right { transform: translate3d(100%, 0, 0); } 
    .section::-webkit-scrollbar { display: none; }
    
    .content-wrapper { display: flex; flex-direction: column; justify-content: flex-start; flex: 1; padding-bottom: 20px;}

    .app-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--nav-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 1000; box-shadow: 0 -5px 25px rgba(0,0,0,0.02); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); cursor: pointer; transition: color 0.2s; flex: 1;}
    .nav-item.active { color: var(--primary); }
    .nav-item span { font-size: 10px; font-weight: 800; letter-spacing: 0.5px;}
    .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s var(--spring); }
    .nav-item.active svg { transform: scale3d(1.15, 1.15, 1) translateY(-2px); }

    /* =========================================
       3. DASHBOARD CARDS & EXPORT BUTTONS
       ========================================= */
    @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(25px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

    .dash-title { font-size: 22px; font-weight: 900; color: var(--text-main); margin-bottom: 20px; letter-spacing: 0.5px; opacity: 0; animation: fadeInUp 0.4s var(--spring) forwards;}

    .dash-list { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .stat-card { border-radius: 20px; padding: 22px; display: flex; flex-direction: row; justify-content: space-between; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.03); border: 1px solid var(--glass-border); opacity: 0; animation: fadeInUp 0.7s var(--spring) forwards; }
    
    .c-rev { background: linear-gradient(135deg, #34D399 0%, #059669 100%); color: white; border: none; animation-delay: 0.05s; }
    .c-pend { background: linear-gradient(135deg, #FBBF24 0%, #D97706 100%); color: white; border: none; animation-delay: 0.1s; }
    .c-exp { background: linear-gradient(135deg, #F87171 0%, #DC2626 100%); color: white; border: none; animation-delay: 0.15s; }
    .c-cust { background: var(--card-bg); color: var(--text-main); animation-delay: 0.2s; }

    .stat-info { display: flex; flex-direction: column; align-items: flex-start; }
    .stat-info h4 { font-size: 12px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 4px; opacity: 0.9;}
    .c-cust .stat-info h4 { color: var(--text-sub); }
    .stat-info h2 { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; line-height: 1;}
    .stat-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;}
    .c-rev .stat-icon, .c-pend .stat-icon, .c-exp .stat-icon { background: rgba(255,255,255,0.25); }
    .c-cust .stat-icon { background: rgba(37, 99, 235, 0.12); color: var(--primary); }
    .stat-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;}
    .c-rev .stat-icon svg, .c-pend .stat-icon svg, .c-exp .stat-icon svg { stroke: #ffffff; }

    /* 3-COLUMN QUICK EXPORT CARD */
    .quick-export-card { background: var(--card-bg); border-radius: 16px; border: 1.5px solid var(--glass-border); display: flex; align-items: stretch; justify-content: space-between; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow: hidden; flex-shrink: 0; opacity: 0; animation: fadeInUp 0.7s var(--spring) 0.25s forwards;}
    .export-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 5px; gap: 8px; cursor: pointer; transition: background 0.3s; }
    .export-item:active { background: rgba(0,0,0,0.04); }
    .export-item:not(:last-child) { border-right: 1.5px solid var(--glass-border); }
    .export-item span { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
    .export-item svg { width: 24px; height: 24px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s var(--spring);}
    .export-item:active svg { transform: scale(0.9); }
    
    .export-item.cust span { color: #2563EB; }
    .export-item.cust svg { stroke: #2563EB; }
    .export-item.staff span { color: #D97706; }
    .export-item.staff svg { stroke: #D97706; }
    .export-item.exp span { color: #DC2626; }
    .export-item.exp svg { stroke: #DC2626; }

    /* =========================================
       4. SLIM BOXED LIST CARDS & DELETE ANIMATION
       ========================================= */
    .empty-state { text-align: center; color: var(--text-sub); font-size: 14px; font-weight: 700; margin: auto 0; padding: 40px; border-radius: 20px; border: 2px dashed var(--glass-border); opacity: 0; animation: fadeInUp 0.6s var(--spring) forwards;}
    
    .view-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); cursor: pointer; position: relative; overflow: hidden; max-height: 250px; transition: all 0.4s var(--spring); transform-origin: left center; opacity: 0; animation: fadeInUp 0.6s var(--spring) forwards; }
    .view-card:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(0,0,0,0.01); }
    .view-card.deleting { opacity: 0 !important; transform: scale(0.85) translateX(-40px) !important; max-height: 0 !important; margin-bottom: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; border-width: 0 !important; }

    .view-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
    .card-cust::before { background: var(--primary); }
    .card-work::before { background: var(--warning); }
    .card-exp::before { background: var(--danger); }
    
    .data-row { display: flex; gap: 6px; width: 100%; }
    .data-box { flex: 1; min-width: 0; background: var(--box-bg); padding: 8px 10px; border-radius: 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; overflow: hidden; border: 1px solid rgba(0,0,0,0.02);}
    .data-box span { font-size: 9px; color: var(--text-sub); font-weight: 800; margin-bottom: 2px; letter-spacing: 0.5px; white-space: nowrap; }
    .data-box strong { display: block; font-size: 13.5px; color: var(--text-main); font-weight: 800; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; line-height: 1.2;}
    
    .data-box.large { padding: 10px; }
    .data-box.large strong { font-size: 15px; font-variant-numeric: tabular-nums; }
    
    .txt-blue { color: #2563EB !important; } .txt-green { color: #059669 !important; } .txt-orange { color: #D97706 !important; } .txt-red { color: #DC2626 !important; }

    #toast { position: absolute; top: -80px; left: 50%; transform: translate3d(-50%, 0, 0); background: var(--text-main); color: var(--bg-main); padding: 12px 24px; border-radius: 30px; font-size: 12px; font-weight: 800; z-index: 9999; transition: transform 0.4s var(--spring); display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); letter-spacing: 0.5px;}
    #toast.show { transform: translate3d(-50%, calc(max(env(safe-area-inset-top), 40px)), 0); }

    /* =========================================
       5. EXACT MATCH A4 PRINT CSS 
       ========================================= */
    #export-container { display: none; }
    @media print {
        :root, html, body { background-color: #ffffff !important; color: #000000 !important; }
        body * { visibility: hidden; }
        #app { display: none !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
        #export-container { display: block !important; position: absolute; left: 0; top: 0; width: 100% !important; margin: 0; padding: 0; visibility: visible; background: #ffffff !important; z-index: 99999; }
        #export-container * { visibility: visible; text-transform: uppercase;}
        @page { size: A4 landscape; margin: 10mm; } 
        .print-view { width: 100%; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; color: #000 !important; box-sizing: border-box; text-align: center; }
        .report-title { font-size: 24px !important; font-weight: 900 !important; margin-bottom: 20px !important; color: #000 !important;}
        .summary-wrapper { display: flex; justify-content: center; width: 100%; margin: 25px 0; page-break-inside: avoid; }
        .summary-box { display: table !important; width: 100% !important; border-collapse: collapse; background-color: #f8f9fa !important; border: 2px solid #e5e7eb !important; border-radius: 12px; }
        .summary-box > div { display: table-cell !important; text-align: center; border-right: 2px solid #e5e7eb; padding: 15px; vertical-align: middle;}
        .summary-box > div:last-child { border-right: none; }
        .summary-box .s-title { font-size: 11px; color: #666 !important; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px;}
        .summary-box .s-val { font-size: 24px; font-weight: 900; margin: 0;}
        .print-table { width: 100%; border-collapse: collapse; font-size: 12px !important; table-layout: fixed;}
        .print-table th, .print-table td { border: 2px solid #e5e7eb !important; padding: 10px 6px !important; text-align: center; word-wrap: break-word;}
        .print-table th { color: #ffffff !important; font-weight: 800 !important; }
        .th-blue th { background-color: #0d6efd !important; border-color: #0d6efd !important; }
        .th-gold th { background-color: #d97706 !important; border-color: #d97706 !important; }
        .th-red th { background-color: #dc2626 !important; border-color: #dc2626 !important; }
        .txt-blue { color: #0d6efd !important; font-weight: 800 !important;}
        .txt-green { color: #16a34a !important; font-weight: 800 !important;}
        .txt-gold { color: #d97706 !important; font-weight: 800 !important;}
        .txt-red { color: #dc2626 !important; font-weight: 800 !important;}
        .txt-bold { font-weight: 800 !important; color: #000 !important;}
        .grand-total td { background-color: #f8f9fa !important; font-weight: 900 !important; color: #000 !important;}
        .print-receipt { width: 100%; font-family: sans-serif; color: #000; box-sizing: border-box; padding: 10px; text-align:left;}
        .p-header { border-bottom: 3px solid #2563EB; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end;}
        .p-brand h1 { font-size: 32px; margin: 0; font-weight: 900; letter-spacing: -1px; color: #2563EB;}
        .p-brand p { font-size: 13px; margin: 4px 0 0; font-weight: bold; letter-spacing: 2px; color: #555;}
        .p-meta { text-align: right; }
        .p-meta h2 { font-size: 20px; margin: 0; font-weight: 900; color: #1c1c1e;}
        .p-meta p { font-size: 13px; margin: 4px 0 0; color: #555; font-weight: bold;}
        .p-info-box { background: #f8f9fa; padding: 18px; border-radius: 12px; border: 1px solid #eaeaea; margin-bottom: 30px; display: flex; justify-content: space-between;}
        .p-info-box div h4 { font-size: 12px; color: #888; margin: 0 0 6px;}
        .p-info-box div p { font-size: 18px; margin: 0; font-weight: 800; color: #1c1c1e;}
        .p-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .p-table th { text-align: left; padding: 12px 8px; font-size: 13px; border-bottom: 2px solid #ddd; color: #888;}
        .p-table td { padding: 18px 8px; font-size: 16px; border-bottom: 1px solid #eee; font-weight: 700; color: #1c1c1e;}
        .text-right { text-align: right !important; } .text-center { text-align: center !important; }
        .p-totals { width: 50%; float: right; }
        .p-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 16px; font-weight: bold; color: #555;}
        .p-row.border-top { border-top: 2px dashed #ccc; margin-top: 10px; padding-top: 20px; font-size: 22px; color: #DC2626; }
    }
</style>
</head>
<body>

<div id="app">

    <div id="toast">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-msg">SUCCESS</span>
    </div>

    <!-- TAB 1: DASHBOARD & EXPORTS -->
    <div id="sec1" class="section active">
        <div class="content-wrapper">
            <h2 class="dash-title">DASHBOARD</h2>
            <div class="dash-list">
                <div class="stat-card c-rev">
                    <div class="stat-info">
                        <h4>Total Revenue</h4>
                        <h2 id="dash-rev">₹0</h2>
                    </div>
                    <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M7 4h10"></path><path d="M7 9h10"></path><path d="M9 4h3c3.5 0 4 5 0 5"></path><path d="M9 14l5.5 7"></path></svg></div>
                </div>

                <div class="stat-card c-pend">
                    <div class="stat-info">
                        <h4>Pending Dues</h4>
                        <h2 id="dash-pend">₹0</h2>
                    </div>
                    <div class="stat-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
                </div>

                <div class="stat-card c-exp">
                    <div class="stat-info">
                        <h4>Total Expenses</h4>
                        <h2 id="dash-exp">₹0</h2>
                    </div>
                    <div class="stat-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div>
                </div>

                <div class="stat-card c-cust">
                    <div class="stat-info">
                        <h4>Total Clients</h4>
                        <h2 id="dash-cust">0</h2>
                    </div>
                    <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>

            <!-- QUICK EXPORT CARD -->
            <div class="quick-export-card">
                <div class="export-item cust" onclick="exportDataPrint('customers')">
                    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>

                </div>
                <div class="export-item staff" onclick="exportDataPrint('workers')">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span>STAFF</span>
                </div>
                <div class="export-item exp" onclick="exportDataPrint('expenses')">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    <span>EXPENSES</span>

        </div>
    </div>

    <!-- TAB 2: CLIENTS -->
    <div id="sec2" class="section">
        <div class="content-wrapper">

            <div id="customer-list"></div>
        </div>
    </div>

    <!-- TAB 3: STAFF -->
    <div id="sec3" class="section">
        <div class="content-wrapper">
            <h2 class="dash-title">STAFF</h2>
            <div id="worker-list"></div>
        </div>

    <!-- TAB 4: EXPENSES -->
    <div id="sec4" class="section">
        <div class="content-wrapper">
            <h2 class="dash-title">EXPENSES</h2>
            <div id="expense-list"></div>
        </div>
    </div>

    <!-- LOCKED BOTTOM NAV -->
    <nav class="app-nav">
        <div class="nav-item active" onclick="switchTab(1, this)"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span></div>
        <div class="nav-item" onclick="switchTab(2, this)"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Clients</span></div>
        <div class="nav-item" onclick="switchTab(3, this)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span>Staff</span></div>
        <div class="nav-item" onclick="switchTab(4, this)"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span>Expense</span></div>

</div>

<div id="export-container"></div>

<!-- CLOUD FIRESTORE INTEGRATION -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, enableNetwork, disableNetwork } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATj9_cJpq0aWsUqqLzPSC-SWPtBuEagwc",
      authDomain: "gulfamlabs.firebaseapp.com",
      projectId: "gulfamlabs",
      storageBucket: "gulfamlabs.firebasestorage.app",
      messagingSenderId: "447195095179",
      appId: "1:447195095179:web:76304c5238cb16493ff48e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, 'appData', 'techAsar'); 

    window.appData = { customers: [], workers: [], expenses: [] };
    
    let isInitialLoad = true;

    // --- SMART NETWORK RESUME ---
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") { disableNetwork(db).then(() => enableNetwork(db)); }
    });
    window.addEventListener("online", () => { disableNetwork(db).then(() => enableNetwork(db)); });

    // REAL-TIME FETCH WITH SMART DELETE ANIMATION & INITIAL LOAD SMOOTHNESS
    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const val = docSnap.data();
            
            if (isInitialLoad) {
                applyDataAndRender(val, true); 
                isInitialLoad = false;
                return;
            }

            let oldCust = window.appData.customers || [];
            let oldWork = window.appData.workers || [];
            let oldExp = window.appData.expenses || [];

            let newCust = val.customers || [];
            let newWork = val.workers || [];
            let newExp = val.expenses || [];

            let deletedCust = oldCust.filter(o => !newCust.find(n => n.id === o.id));
            let deletedWork = oldWork.filter(o => !newWork.find(n => n.id === o.id));
            let deletedExp = oldExp.filter(o => !newExp.find(n => n.id === o.id));

            let hasDeletions = deletedCust.length > 0 || deletedWork.length > 0 || deletedExp.length > 0;

            if (hasDeletions) {
                deletedCust.forEach(d => { let el = document.getElementById(`item-cust-${d.id}`); if(el) el.classList.add('deleting'); });
                deletedWork.forEach(d => { let el = document.getElementById(`item-work-${d.id}`); if(el) el.classList.add('deleting'); });
                deletedExp.forEach(d => { let el = document.getElementById(`item-exp-${d.id}`); if(el) el.classList.add('deleting'); });

                setTimeout(() => { applyDataAndRender(val, false); }, 400); 
            } else {
                applyDataAndRender(val, false);
            }
        }
    });

    function applyDataAndRender(val, isInit) {
        window.appData = {
            customers: val.customers || [],
            workers: val.workers || [],
            expenses: val.expenses || []
        };
        window.updateDashboard(); 
        window.renderCustomers(isInit); 
        window.renderWorkers(isInit); 
        window.renderExpenses(isInit);
    }

    function lockMobileHeight() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
    window.addEventListener('resize', lockMobileHeight); lockMobileHeight();
    
    // Set initial off-screen classes on load
    document.querySelectorAll('.section').forEach(s => { let id = parseInt(s.id.replace('sec', '')); if (id > 1) s.classList.add('slide-right'); });

    window.showToast = function(msg) { 
        const toast = document.getElementById('toast'); 
        document.getElementById('toast-msg').innerText = msg; 
        toast.classList.add('show'); 
        setTimeout(() => toast.classList.remove('show'), 2000);
    };
    
    window.switchTab = function(tabId, el) { 
        document.querySelectorAll('.section').forEach(s => { 
            let id = parseInt(s.id.replace('sec', '')); 
            s.classList.remove('active', 'slide-left', 'slide-right'); 
            
            if (id < tabId) {
                s.classList.add('slide-left'); 
            } else if (id > tabId) {
                s.classList.add('slide-right'); 
            }
        }); 
        
        const targetTab = document.getElementById('sec' + tabId);
        targetTab.classList.remove('slide-left', 'slide-right'); 
        targetTab.classList.add('active'); 
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); 
        el.classList.add('active'); 
    };

    window.countUpAnimation = function(element, start, end, duration, prefix = "") { 
        let startTimestamp = null; 
        const step = (timestamp) => { 
            if (!startTimestamp) startTimestamp = timestamp; 
            const progress = Math.min((timestamp - startTimestamp) / duration, 1); 
            const easeProgress = 1 - Math.pow(1 - progress, 3); 
            element.innerText = prefix + Math.floor(easeProgress * (end - start) + start).toLocaleString('en-IN'); 
            if (progress < 1) window.requestAnimationFrame(step); else element.innerText = prefix + end.toLocaleString('en-IN'); 
        }; 
        window.requestAnimationFrame(step); 
    };

    window.updateDashboard = function() {
        let totalRev = 0, totalPend = 0, totalExp = 0; 
        window.appData.customers.forEach(c => { totalRev += c.total; totalPend += c.pending; }); 
        window.appData.expenses.forEach(e => { totalExp += e.amount; });
        
        countUpAnimation(document.getElementById('dash-cust'), 0, window.appData.customers.length, 1000); 
        countUpAnimation(document.getElementById('dash-rev'), 0, totalRev, 1000, "₹"); 
        countUpAnimation(document.getElementById('dash-pend'), 0, totalPend, 1000, "₹"); 
        countUpAnimation(document.getElementById('dash-exp'), 0, totalExp, 1000, "₹"); 
    };

    window.formatDateStr = function(dateStr) {
        if(!dateStr) return '--';
        if(/[a-zA-Z]/.test(dateStr)) return dateStr;
        let parts = dateStr.split(/[-/]/);
        if(parts.length === 3) {
            let d, m, y;
            if (parts[0].length === 4) { 
                y = parseInt(parts[0]); m = parseInt(parts[1]); d = parseInt(parts[2]);
            } else {
                d = parseInt(parts[0]); m = parseInt(parts[1]); y = parseInt(parts[2]);
                if (m > 12) { let temp = d; d = m; m = temp; }
            }
            if (y < 100) y += 2000;
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            return `${d.toString().padStart(2, '0')} ${months[m-1]} ${y}`;
        }
        return dateStr;
    };

    window.renderCustomers = function(isInit = false) { 
        const list = document.getElementById('customer-list'); let htmlBatch = ''; 
        if(window.appData.customers.length === 0) { list.innerHTML = '<div class="empty-state">NO CLIENTS FOUND</div>'; return; }
        
        window.appData.customers.slice().reverse().forEach((c, i) => { 
            let fDate = window.formatDateStr(c.date);
            let animStyle = isInit ? `animation-delay: ${Math.min(i * 0.04, 0.4)}s;` : `animation: none; opacity: 1;`;
            htmlBatch += `
                <div id="item-cust-${c.id}" class="view-card card-cust" style="${animStyle}" onclick="exportReceiptPrint(${c.id})">
                    <div class="data-row">
                        <div class="data-box" style="flex:1;"><span>Name</span><strong>${c.name}</strong></div>
                        <div class="data-box" style="flex: 0 0 115px;"><span>Date</span><strong>${fDate}</strong></div>
                    </div>
                    <div class="data-row">
                        <div class="data-box" style="flex: 1.2;"><span>Mobile</span><strong>${c.mobile}</strong></div>
                        <div class="data-box" style="flex: 1;"><span>Item</span><strong>${c.item}</strong></div>
                        <div class="data-box" style="flex: 0 0 70px;"><span>Qty</span><strong>${c.qty}</strong></div>
                    </div>
                    <div class="data-row">
                        <div class="data-box large"><span>Total</span><strong class="txt-blue">₹${c.total.toLocaleString('en-IN')}</strong></div>
                        <div class="data-box large"><span>Received</span><strong class="txt-green">₹${c.advance.toLocaleString('en-IN')}</strong></div>
                        <div class="data-box large"><span>Pending</span><strong class="txt-red">₹${c.pending.toLocaleString('en-IN')}</strong></div>
                    </div>
                </div>`; 
        }); 
        list.innerHTML = htmlBatch; 
    };

    window.renderWorkers = function(isInit = false) { 
        const list = document.getElementById('worker-list'); let htmlBatch = ''; 
        if(window.appData.workers.length === 0) { list.innerHTML = '<div class="empty-state">NO STAFF FOUND</div>'; return; }
        
        window.appData.workers.forEach((w, i) => { 
            let fDate = window.formatDateStr(w.date);
            let sColorClass = w.status === 'PRESENT' ? 'txt-green' : w.status === 'HALF DAY' ? 'txt-orange' : w.status === 'ABSENT' ? 'txt-red' : '';
            let timeInfo = (w.timeIn || w.timeOut) ? `${window.formatTimeAMPM(w.timeIn)} - ${window.formatTimeAMPM(w.timeOut)}` : '--';
            let advHTML = w.advance > 0 ? `<div class="data-row"><div class="data-box large"><span>Total Advance Issued</span><strong class="txt-blue">₹${w.advance.toLocaleString('en-IN')}</strong></div></div>` : '';
            let animStyle = isInit ? `animation-delay: ${Math.min(i * 0.04, 0.4)}s;` : `animation: none; opacity: 1;`;

            htmlBatch += `
                <div id="item-work-${w.id}" class="view-card card-work" style="${animStyle}" onclick="exportWorkerPrint(${w.id})">
                    <div class="data-row">
                        <div class="data-box" style="flex:1;"><span>Name</span><strong>${w.name}</strong></div>
                        <div class="data-box" style="flex: 0 0 115px;"><span>Date</span><strong>${fDate}</strong></div>
                    </div>
                    <div class="data-row">
                        <div class="data-box" style="flex: 0 0 105px;"><span>Status</span><strong class="${sColorClass}">${w.status}</strong></div>
                        <div class="data-box" style="flex:1;"><span>Timing</span><strong>${timeInfo}</strong></div>
                    </div>
                    ${advHTML}
                </div>`; 
        }); 
        list.innerHTML = htmlBatch; 
    };

    window.renderExpenses = function(isInit = false) { 
        const list = document.getElementById('expense-list'); let htmlBatch = ''; 
        let exps = [...window.appData.expenses].sort((a,b) => b.id - a.id); 
        if(exps.length === 0) { list.innerHTML = '<div class="empty-state">NO EXPENSES FOUND</div>'; return; }
        
        exps.forEach((e, i) => { 
            let fDate = window.formatDateStr(e.date);
            let animStyle = isInit ? `animation-delay: ${Math.min(i * 0.04, 0.4)}s;` : `animation: none; opacity: 1;`;

            htmlBatch += `
                <div id="item-exp-${e.id}" class="view-card card-exp" style="${animStyle}" onclick="exportDataPrint('expenses')">
                    <div class="data-row">
                        <div class="data-box" style="flex:1;"><span>Expense Type</span><strong>${e.type}</strong></div>
                        <div class="data-box" style="flex: 0 0 115px;"><span>Date</span><strong>${fDate}</strong></div>
                    </div>
                    <div class="data-row">
                        <div class="data-box large"><span>Amount</span><strong class="txt-red">-₹${e.amount.toLocaleString('en-IN')}</strong></div>
                    </div>
                </div>`; 
        }); 
        list.innerHTML = htmlBatch; 
    };

    window.triggerPrint = function(contentHTML) {
        const container = document.getElementById('export-container');
        container.innerHTML = contentHTML;
        setTimeout(() => { window.print(); }, 300);
    };

    window.formatTimeAMPM = function(timeStr) { if(!timeStr) return '--'; let [h, m] = timeStr.split(':'); let hours = parseInt(h); let ampm = hours >= 12 ? 'PM' : 'AM'; hours = hours % 12; hours = hours ? hours : 12; return `${hours}:${m} ${ampm}`; };

    window.exportReceiptPrint = function(id) { 
        const c = window.appData.customers.find(x => x.id === id); if(!c) return; 
        const invNo = "INV-" + Math.floor(1000 + Math.random() * 9000); 
        let fDate = window.formatDateStr(c.date);

        const content = `
            <div class="print-receipt">
                <div class="p-header">
                    <div class="p-brand"><h1>TECH ASAR</h1><p>PREMIUM POWDER COATING</p></div>
                    <div class="p-meta"><h2>RECEIPT</h2><p>NO: #${invNo} | DATE: ${fDate}</p></div>
                </div>
                <div class="p-info-box">
                    <div><h4>BILLED TO</h4><p>${c.name}</p></div>
                    <div style="text-align:right;"><h4>MOBILE</h4><p>+91 ${c.mobile}</p></div>
                </div>
                <table class="p-table">
                    <thead><tr><th>ITEM DETAILS</th><th class="text-center">QTY</th><th class="text-right">RATE</th></tr></thead>
                    <tbody><tr><td>${c.item}</td><td class="text-center">${c.qty}</td><td class="text-right">₹${c.rate}</td></tr></tbody>
                </table>
                <div class="p-totals">
                    <div class="p-row"><span>TOTAL AMOUNT</span><span>₹${c.total}</span></div>
                    <div class="p-row" style="color:#059669;"><span>ADVANCE PAID</span><span>- ₹${c.advance}</span></div>
                    <div class="p-row border-top"><span>PENDING DUE</span><span>₹${c.pending}</span></div>
                </div>
            </div>`; 
        triggerPrint(content); 
    };

    window.exportWorkerPrint = function(id) { 
        const w = window.appData.workers.find(x => x.id === id); if(!w) return; 
        
        let historyHTML = ''; 
        let presentCount = 0; let halfCount = 0; let absentCount = 0;
        const currentMonth = new Date().getMonth();
        const currentYear = new Date().getFullYear();

        let allRecords = w.history && w.history.length > 0 ? w.history : [{date: w.date, status: w.status, timeIn: w.timeIn, timeOut: w.timeOut, adv: w.advance}];

        allRecords.forEach(h => { 
            let fDate = window.formatDateStr(h.date);
            let recMonth, recYear;
            
            if(/[a-zA-Z]/.test(fDate)) {
                let p = fDate.split(' ');
                recMonth = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"].indexOf(p[1]);
                recYear = parseInt(p[2]);
            } else {
                let p = h.date.split(/[-/]/);
                let d = parseInt(p[0]); let m = parseInt(p[1]); let y = parseInt(p[2]);
                if (m > 12) m = d; recMonth = m - 1; recYear = y < 100 ? y + 2000 : y;
            }

            if(recMonth === currentMonth && recYear === currentYear) {
                if (h.status === 'PRESENT') presentCount++;
                if (h.status === 'HALF DAY') halfCount++;
                if (h.status === 'ABSENT') absentCount++;
            }

            let sColorClass = h.status === 'PRESENT' ? 'txt-green' : h.status === 'HALF DAY' ? 'txt-gold' : h.status === 'ABSENT' ? 'txt-red' : '';
            historyHTML += `<tr><td>${fDate}</td><td class="${sColorClass}">${h.status}</td><td>${window.formatTimeAMPM(h.timeIn)} - ${window.formatTimeAMPM(h.timeOut)}</td><td class="txt-blue">₹${h.adv}</td></tr>`; 
        }); 

        const content = `
            <div class="print-view">
                <div class="report-title">STAFF REPORT: ${w.name.toUpperCase()}</div>
                
                <table class="print-table" style="margin-bottom: 25px;">
                    <thead class="th-gold"><tr><th>DATE</th><th>STATUS</th><th>TIMING</th><th>ADVANCE</th></tr></thead>
                    <tbody>${historyHTML}</tbody>
                </table>
                
                <div class="summary-wrapper">
                    <div class="summary-box">
                        <div><div class="s-title">THIS MONTH PRESENT</div><div class="s-val txt-green">${presentCount}</div></div>
                        <div><div class="s-title">THIS MONTH HALF DAY</div><div class="s-val txt-gold">${halfCount}</div></div>
                        <div><div class="s-title">THIS MONTH ABSENT</div><div class="s-val txt-red">${absentCount}</div></div>
                        <div><div class="s-title">TOTAL ADVANCE</div><div class="s-val txt-blue">₹${w.advance}</div></div>
                    </div>
                </div>
            </div>`; 
        triggerPrint(content); 
    };

    window.exportDataPrint = function(type) { 
        let tableHTML = ''; let title = ''; let theadClass = '';
        
        if(type === 'customers') { 
            title = 'CUSTOMER RECORDS EXPORT'; 
            theadClass = 'th-blue';
            tableHTML += `<thead class="${theadClass}"><tr><th>DATE</th><th>NAME</th><th>MOBILE</th><th>ITEM</th><th>QTY</th><th>RATE</th><th>TOTAL AMT</th><th>RECEIVED</th><th>PENDING</th></tr></thead><tbody>`; 
            let tQty=0, tTotal=0, tRecv=0, tPend=0; 
            window.appData.customers.forEach(c => { 
                let fDate = window.formatDateStr(c.date);
                tableHTML += `<tr><td>${fDate}</td><td class="txt-bold">${c.name}</td><td>${c.mobile}</td><td class="txt-bold">${c.item}</td><td>${c.qty}</td><td>${c.rate}</td><td class="txt-blue">${c.total}</td><td class="txt-green">${c.advance}</td><td class="txt-red">${c.pending}</td></tr>`; 
                tQty+=c.qty; tTotal+=c.total; tRecv+=c.advance; tPend+=c.pending; 
            }); 
            tableHTML += `<tr class="grand-total"><td colspan="4" class="text-right">GRAND TOTAL:</td><td class="txt-blue">${tQty}</td><td></td><td class="txt-blue">${tTotal}</td><td class="txt-green">${tRecv}</td><td class="txt-red">${tPend}</td></tr></tbody>`; 
        } 
        else if(type === 'workers') { 
            title = 'WORKERS ATTENDANCE EXPORT'; 
            theadClass = 'th-gold';
            tableHTML += `<thead class="${theadClass}"><tr><th>DATE</th><th>NAME</th><th>STATUS</th><th>TIME IN</th><th>TIME OUT</th><th>ADVANCE</th></tr></thead><tbody>`; 
            window.appData.workers.forEach(w => { 
                let fDate = window.formatDateStr(w.date);
                let sColorClass = w.status === 'PRESENT' ? 'txt-green' : w.status === 'HALF DAY' ? 'txt-gold' : w.status === 'ABSENT' ? 'txt-red' : '';
                tableHTML += `<tr><td>${fDate}</td><td>${w.name}</td><td class="${sColorClass}">${w.status}</td><td>${window.formatTimeAMPM(w.timeIn)}</td><td>${window.formatTimeAMPM(w.timeOut)}</td><td class="txt-blue">${w.advance}</td></tr>`; 
            }); 
            tableHTML += '</tbody>';
        } 
        else if(type === 'expenses') { 
            title = 'EXPENSES RECORDS EXPORT'; 
            theadClass = 'th-red';
            tableHTML += `<thead class="${theadClass}"><tr><th>DATE</th><th>EXPENSE TYPE</th><th>AMOUNT (₹)</th></tr></thead><tbody>`; 
            let tAmt=0; 
            window.appData.expenses.forEach(e => { 
                let fDate = window.formatDateStr(e.date);
                tableHTML += `<tr><td>${fDate}</td><td class="txt-bold">${e.type}</td><td class="txt-red">${e.amount}</td></tr>`; tAmt+=e.amount; 
            }); 
            tableHTML += `<tr class="grand-total"><td colspan="2" class="text-right">TOTAL EXPENSES:</td><td class="txt-red">${tAmt}</td></tr></tbody>`; 
        } 
        
        triggerPrint(`<div class="print-view"><div class="report-title">${title}</div><table class="print-table">${tableHTML}</table></div>`); 
    };
</script>
</body>
</html>
