<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tech Asar - LIVE VIEWER</title>
<meta name="color-scheme" content="light dark">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    /* =========================================
       1. VIEWER SPECIFIC STYLES
       ========================================= */
    :root { 
        --vh: 1vh; --primary: #5e5ce6; --success: #30d158; --warning: #ff9f0a; --danger: #ff453a; 
        --bg-main: #f2f2f7; --glass-bg: rgba(255, 255, 255, 0.75); --glass-border: rgba(255, 255, 255, 0.4); 
        --text-main: #1c1c1e; --text-sub: #8e8e93; --card-bg: #ffffff; 
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --app-launch: cubic-bezier(0.25, 1, 0.5, 1); 
    }
    html.dark-mode { 
        --bg-main: #000000; --glass-bg: rgba(30, 30, 30, 0.65); --glass-border: rgba(255, 255, 255, 0.1); 
        --text-main: #ffffff; --text-sub: #ebebf5; --card-bg: #1c1c1e; color-scheme: dark; 
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-font-smoothing: antialiased; }
    body { height: 100vh; height: calc(var(--vh, 1vh) * 100); width: 100%; overflow: hidden; background-color: var(--bg-main); color: var(--text-main); transition: background-color 0.4s ease; }
    
    /* Viewer Ambient Background */
    .bg-mesh { position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 20%, rgba(94, 92, 230, 0.15), transparent 40%), radial-gradient(circle at 70% 80%, rgba(48, 209, 88, 0.1), transparent 40%); z-index: -1; pointer-events: none; animation: pulse 12s ease-in-out infinite alternate; will-change: transform; transform: translateZ(0); }
    html.dark-mode .bg-mesh { background: radial-gradient(circle at 30% 20%, rgba(94, 92, 230, 0.25), transparent 40%), radial-gradient(circle at 70% 80%, rgba(48, 209, 88, 0.15), transparent 40%); }
    @keyframes pulse { 0% { transform: scale(1) translate3d(0,0,0); } 100% { transform: scale(1.05) translate3d(-3%, 3%, 0); } }
    
    #app { width: 100%; max-width: 500px; height: 100%; position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; overflow: hidden; }
    .glass-panel { background: var(--glass-bg); backdrop-filter: blur(24px) saturate(200%); -webkit-backdrop-filter: blur(24px) saturate(200%); border: 1px solid var(--glass-border); box-shadow: 0 10px 40px rgba(0,0,0,0.08); transform: translateZ(0); }
    
    /* Top Global Header */
    .top-header { position: absolute; top: 0; left: 0; width: 100%; padding: max(env(safe-area-inset-top), 20px) 20px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; border-top: none; border-left: none; border-right: none;}
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase;}
    .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(255, 69, 58, 0.15); color: var(--danger); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: 1px;}
    .live-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: blink 1.5s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    
    /* Smooth Tab Switching */
    .section { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: calc(max(env(safe-area-inset-top), 20px) + 65px) 20px calc(env(safe-area-inset-bottom) + 100px); opacity: 0; visibility: hidden; transition: opacity 0.45s var(--app-launch), transform 0.45s var(--app-launch), visibility 0.45s; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; will-change: opacity, transform, visibility; }
    .section.active { opacity: 1; visibility: visible; transform: translate3d(0,0,0); z-index: 10; }
    .section.slide-left { transform: translate3d(-60px, 0, 0); } .section.slide-right { transform: translate3d(60px, 0, 0); } .section::-webkit-scrollbar { display: none; }
    
    /* Viewer Floating Nav */
    .floating-nav { position: absolute; bottom: max(env(safe-area-inset-bottom), 20px); left: 50%; transform: translateX(-50%); border-radius: 30px; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; width: 92%; z-index: 1000; box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-sub); cursor: pointer; transition: color 0.3s ease; padding: 5px 10px;}
    .nav-item.active { color: var(--primary); }
    .nav-item span { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; transition: transform 0.4s var(--spring); }
    .nav-item.active svg { transform: scale3d(1.15, 1.15, 1) translate3d(0,-2px,0); }

    /* Dashboard Vertical Stats (Viewer Optimized) */
    .stat-card { border-radius: 24px; padding: 22px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transform: translateZ(0); }
    .stat-card.rev { background: linear-gradient(135deg, #30d158 0%, #24a145 100%); box-shadow: 0 10px 25px rgba(48, 209, 88, 0.3); }
    .stat-card.pend { background: linear-gradient(135deg, #ff9f0a 0%, #d88200 100%); box-shadow: 0 10px 25px rgba(255, 159, 10, 0.3); }
    .stat-card.exp { background: linear-gradient(135deg, #ff453a 0%, #d6332a 100%); box-shadow: 0 10px 25px rgba(255, 69, 58, 0.3); }
    .stat-card.cust { background: var(--card-bg); border: 1px solid var(--glass-border); color: var(--text-main); }
    .stat-info h4 { font-size: 13px; opacity: 0.9; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;}
    .stat-card.cust .stat-info h4 { color: var(--text-sub); }
    .stat-info h2 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px;}
    .stat-icon { width: 50px; height: 50px; border-radius: 16px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
    .stat-card.cust .stat-icon { background: rgba(94, 92, 230, 0.1); color: var(--primary); }

    /* Clean Viewer Lists (No Hover/Click effects) */
    .section-title { font-size: 18px; font-weight: 800; margin: 10px 0 15px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;}
    .empty-state { text-align: center; color: var(--text-sub); font-size: 14px; font-weight: 600; margin-top: 40px; padding: 30px; background: var(--input-bg); border-radius: 20px;}
    
    .view-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    .card-content h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; color: var(--text-main);}
    .card-meta { font-size: 12px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; line-height: 1.5;}
    .card-value { text-align: right; }
    .card-value .amt { font-size: 18px; font-weight: 900; }
    .card-value .sub { font-size: 11px; font-weight: 700; opacity: 0.8; margin-top: 4px; text-transform: uppercase;}
    
    /* Dedicated Download Button style for Viewer */
    .dl-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--input-bg); color: var(--primary); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; flex-shrink: 0; margin-left: 12px;}
    .dl-btn:active { transform: scale3d(0.85, 0.85, 1); }
    .dl-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* Settings Screen */
    .setting-card { background: var(--card-bg); border-radius: 20px; padding: 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid var(--glass-border);}
    .setting-card span { font-size: 15px; font-weight: 700; text-transform: uppercase; }
    .big-dl-btn { width: 100%; padding: 18px; border-radius: 20px; background: rgba(48, 209, 88, 0.15); color: var(--success); font-weight: 800; font-size: 15px; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; transition: transform 0.2s; cursor: pointer;}
    .big-dl-btn:active { transform: scale3d(0.95, 0.95, 1); }
    
    /* Toast */
    #toast { position: absolute; top: -60px; left: 50%; transform: translate3d(-50%, 0, 0); background: #1c1c1e; color: #fff; padding: 14px 28px; border-radius: 30px; font-size: 13px; font-weight: 800; z-index: 9999; transition: transform 0.4s var(--spring); display: flex; align-items: center; gap: 10px; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.2); will-change: transform;}
    #toast.show { transform: translate3d(-50%, calc(max(env(safe-area-inset-top), 40px) + 80px), 0); }
    
    /* Toggle Switch */
    .ios-switch { position: relative; display: inline-block; width: 50px; height: 28px; } .ios-switch input { opacity: 0; width: 0; height: 0; } .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; } .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); } input:checked + .slider { background-color: var(--primary); } input:checked + .slider:before { transform: translate3d(22px,0,0); }

    /* Export Container (Hidden) */
    #export-container { position: absolute; top: -9999px; left: -9999px; width: 1000px; z-index: -999; display: block; }
    .export-invoice-box { padding: 50px; width: 700px; color: #1c1c1e; font-family: sans-serif; background: #ffffff; border-radius: 24px; border: 1px solid #eaeaea;} .inv-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #007aff; padding-bottom: 20px; margin-bottom: 30px; } .inv-header-left h1 { font-size: 38px; color: #007aff; margin: 0; font-weight: 900;} .inv-header-right { text-align: right; } .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; } .inv-table th { text-align: left; padding: 12px 8px; color: #888; font-size: 14px; border-bottom: 2px solid #eee;} .inv-table td { padding: 20px 8px; font-size: 18px; font-weight: 700; border-bottom: 1px solid #eee; } .inv-row { display: flex; justify-content: space-between; padding: 12px 8px; font-size: 18px; font-weight: 600; color: #666;} .inv-total-row { display: flex; justify-content: space-between; padding: 25px 8px 10px; margin-top: 15px; border-top: 2px dashed #ccc; font-size: 28px; font-weight: 900; color: #ff3b30; }
    .export-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; text-align: center; border: 2px solid #ddd; background: #fff;} .export-table th, .export-table td { border: 2px solid #ddd; padding: 12px 6px; color:#000; } .export-title { font-size: 28px; margin-bottom: 20px; font-weight: bold; text-align: center; color: #000; background: #fff;}
</style>
</head>
<body>
<div class="bg-mesh"></div>

<div id="app">
    <div id="toast">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--success)"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
        <span id="toast-msg">SUCCESS</span>
    </div>

    <!-- GLOBAL HEADER -->
    <div class="top-header glass-panel">
        <div class="brand">TECH ASAR</div>
        <div class="live-badge"><div class="live-dot"></div> LIVE SYNC</div>
    </div>

    <!-- TAB 1: SUMMARY DASHBOARD -->
    <div id="sec1" class="section active">
        <div class="section-title">Overview</div>
        
        <div class="stat-card rev">
            <div class="stat-info">
                <h4>Total Revenue</h4>
                <h2 id="dash-rev">₹0</h2>

            <div class="stat-icon">

            </div>
        </div>

        <div class="stat-card pend">

                <h4>Pending Dues</h4>

            </div>
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" width="28" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>

            </div>
        </div>

        <div class="stat-card cust">
            <div class="stat-info">
                <h4>Total Clients</h4>
                <h2 id="dash-cust">0</h2>
            </div>
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" width="28" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </div>
        </div>
    </div>

    <!-- TAB 2: CLIENT LEDGER (Read Only Feed) -->
    <div id="sec2" class="section">
        <div class="section-title">Client Ledger</div>
        <div id="customer-list"></div>
    </div>

    <!-- TAB 3: STAFF RECORDS (Read Only Feed) -->
    <div id="sec3" class="section">
        <div class="section-title">Staff Records</div>
        <div id="worker-list"></div>
    </div>

    <!-- TAB 4: SETTINGS & EXPORTS -->
    <div id="sec4" class="section">
        <div class="section-title">Preferences</div>
        <div class="setting-card">
            <span>DARK MODE</span>
            <label class="ios-switch">
                <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="section-title" style="margin-top:20px;">Export Data</div>
        <button class="big-dl-btn" onclick="exportDataImage('customers')">
            <svg viewBox="0 0 24 24" width="22" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> 
            CLIENTS REPORT
        </button>
        <button class="big-dl-btn" style="color:var(--warning); background:rgba(255,159,10,0.15);" onclick="exportDataImage('workers')">
            <svg viewBox="0 0 24 24" width="22" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> 
            STAFF REPORT
        </button>

            <svg viewBox="0 0 24 24" width="22" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> 
            EXPENSES REPORT

    <!-- FLOATING BOTTOM NAV -->
    <nav class="floating-nav glass-panel">
        <div class="nav-item active" onclick="switchTab(1, this)">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            <span>HOME</span>
        </div>
        <div class="nav-item" onclick="switchTab(2, this)">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>LEDGER</span>
        </div>
        <div class="nav-item" onclick="switchTab(3, this)">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
            <span>STAFF</span>
        </div>
        <div class="nav-item" onclick="switchTab(4, this)">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
            <span>SETTINGS</span>
        </div>
    </nav>
</div>
<div id="export-container"></div>

<!-- CLOUD FIRESTORE INTEGRATION (READ ONLY) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATj9_cJpq0aWsUqqLzPSC-SWPtBuEagwc",
      authDomain: "gulfamlabs.firebaseapp.com",
      projectId: "gulfamlabs",
      storageBucket: "gulfamlabs.firebasestorage.app",
      messagingSenderId: "447195095179",
      appId: "1:447195095179:web:76304c5238cb16493ff48e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, 'appData', 'techAsar'); 

    window.appData = { customers: [], workers: [], expenses: [], settings: { darkMode: false } };

    // Real-time Sync (Read-Only)
    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const val = docSnap.data();
            window.appData = {
                customers: val.customers || [],
                workers: val.workers || [],
                expenses: val.expenses || [],
                settings: val.settings || window.appData.settings
            };
        }
        updateDashboard(); renderCustomers(); renderWorkers(); 
    });

    // Dark Mode Logic
    window.toggleDarkMode = function() {
        let isDark = document.getElementById('dark-mode-toggle').checked;
        if(isDark) document.documentElement.classList.add('dark-mode');
        else document.documentElement.classList.remove('dark-mode');
    };

    // Viewport Fix
    function lockMobileHeight() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
    window.addEventListener('resize', lockMobileHeight); lockMobileHeight();
    
    // Set initial slide states for smooth first tab switch
    document.querySelectorAll('.section').forEach(s => { let id = parseInt(s.id.replace('sec', '')); if (id > 1) s.classList.add('slide-right'); });

    window.showToast = function(msg) { 
        const toast = document.getElementById('toast'); 
        document.getElementById('toast-msg').innerText = msg.toUpperCase(); 
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                toast.classList.add('show'); 
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        });
    };
    
    window.switchTab = function(tabId, el) { 
        document.querySelectorAll('.section').forEach(s => { 
            let id = parseInt(s.id.replace('sec', '')); 
            s.classList.remove('active', 'slide-left', 'slide-right'); 
            if (id < tabId) s.classList.add('slide-left'); else if (id > tabId) s.classList.add('slide-right'); 
        }); 
        document.getElementById('sec' + tabId).classList.remove('slide-left', 'slide-right'); 
        document.getElementById('sec' + tabId).classList.add('active'); 
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); 
        el.classList.add('active'); 
    };

    window.countUpAnimation = function(element, start, end, duration, prefix = "") { 
        let startTimestamp = null; 
        const step = (timestamp) => { 
            if (!startTimestamp) startTimestamp = timestamp; 
            const progress = Math.min((timestamp - startTimestamp) / duration, 1); 
            const easeProgress = 1 - Math.pow(1 - progress, 3); 
            element.innerText = prefix + Math.floor(easeProgress * (end - start) + start).toLocaleString('en-IN'); 
            if (progress < 1) window.requestAnimationFrame(step); else element.innerText = prefix + end.toLocaleString('en-IN'); 
        }; 
        window.requestAnimationFrame(step); 
    };

    window.updateDashboard = function() {
        let totalRev = 0, totalPend = 0, totalExp = 0; 
        window.appData.customers.forEach(c => { totalRev += c.total; totalPend += c.pending; }); 
        window.appData.expenses.forEach(e => { totalExp += e.amount; });
        
        countUpAnimation(document.getElementById('dash-cust'), 0, window.appData.customers.length, 1000); 
        countUpAnimation(document.getElementById('dash-rev'), 0, totalRev, 1000, "₹"); 
        countUpAnimation(document.getElementById('dash-pend'), 0, totalPend, 1000, "₹"); 
        countUpAnimation(document.getElementById('dash-exp'), 0, totalExp, 1000, "₹"); 
    };

    window.renderCustomers = function() { 
        const list = document.getElementById('customer-list'); let htmlBatch = ''; 
        if(window.appData.customers.length === 0) htmlBatch = '<div class="empty-state">NO CLIENT RECORDS FOUND</div>';
        
        // Render Client Cards (Non-clickable, view only)
        window.appData.customers.slice().reverse().forEach(c => { 
            htmlBatch += `
                <div class="view-card">
                    <div class="card-content">
                        <h3>${c.name}</h3>
                        <div class="card-meta">QTY: ${c.qty} | ITEM: ${c.item}<br>DATE: ${c.date}</div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div class="card-value">
                            <div class="amt" style="color:var(--primary);">₹${c.total}</div>
                            <div class="sub" style="color:var(--danger);">PENDING: ₹${c.pending}</div>
                        </div>
                        <button class="dl-btn" onclick="exportReceiptImage(${c.id})"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
                    </div>
                </div>`; 
        }); 
        list.innerHTML = htmlBatch; 
    };

    window.renderWorkers = function() { 
        const list = document.getElementById('worker-list'); let htmlBatch = ''; 
        if(window.appData.workers.length === 0) htmlBatch = '<div class="empty-state">NO STAFF RECORDS FOUND</div>';
        
        const today = new Date().toLocaleDateString(); 
        window.appData.workers.forEach(w => { 
            let sColor = w.status === 'PRESENT' ? 'var(--success)' : w.status === 'HALF DAY' ? 'var(--warning)' : w.status === 'ABSENT' ? 'var(--danger)' : 'var(--text-sub)'; 
            let timeInfo = (w.timeIn || w.timeOut) ? `${w.timeIn || '--'} to ${w.timeOut || '--'}` : 'NO TIME LOGGED';
            
            htmlBatch += `
                <div class="view-card">
                    <div class="card-content">
                        <h3>${w.name}</h3>
                        <div class="card-meta" style="color:${sColor}; font-weight:800;">${w.status} <span style="color:var(--text-sub); font-weight:600;">| ${w.date}</span></div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div class="card-value">
                            <div class="amt" style="font-size:14px; color:var(--text-main);">${timeInfo}</div>
                            <div class="sub" style="color:var(--primary);">ADV: ₹${w.advance}</div>
                        </div>
                        <button class="dl-btn" style="color:var(--warning); background:rgba(255,159,10,0.15);" onclick="exportWorkerImage(${w.id})"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
                    </div>
                </div>`; 
        }); 
        list.innerHTML = htmlBatch; 
    };

    // Exports UI Setup
    window.generateAndDownloadHDImage = function(htmlContent, filename) { 
        showToast("GENERATING REPORT..."); const container = document.getElementById('export-container'); container.innerHTML = htmlContent; 
        html2canvas(container, { scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false }).then(canvas => { const link = document.createElement('a'); link.download = filename + '.jpg'; link.href = canvas.toDataURL("image/jpeg", 1.0); link.click(); container.innerHTML = ''; showToast("DOWNLOAD COMPLETE"); }).catch(err => { console.error(err); showToast("EXPORT ERROR"); }); 
    };

    window.exportReceiptImage = function(id) { 
        const c = window.appData.customers.find(x => x.id === id); if(!c) return; const invNo = "INV-" + Math.floor(1000 + Math.random() * 9000); 
        const content = `<div class="export-invoice-box"><div class="inv-header"><div class="inv-header-left"><h1>TECH ASAR</h1><p>PREMIUM POWDER COATING</p></div><div class="inv-header-right"><h2>INVOICE</h2><p>${c.date}</p></div></div><div class="inv-details"><div><p class="label">BILLED TO</p><p style="font-weight:800; font-size:22px;">${c.name}</p><p style="color:#666; font-size:16px;">+91 ${c.mobile}</p></div><div style="text-align: right;"><p class="label">INVOICE NO</p><p style="font-weight:800; font-size:22px;">#${invNo}</p></div></div><table class="inv-table"><thead><tr><th>DESCRIPTION</th><th class="center">QTY</th><th class="right">AMOUNT</th></tr></thead><tbody><tr><td><span style="font-size:20px; font-weight:800; color:#1c1c1e;">${c.item}</span><br><span style="font-size:15px; color:#888;">RATE: ₹${c.rate}</span></td><td class="center" style="font-size:20px;">${c.qty}</td><td class="right" style="font-size:20px; color:#007aff;">₹${c.total}</td></tr></tbody></table><div style="margin-left: 50%;"><div class="inv-row"><span>SUBTOTAL</span><strong>₹${c.total}</strong></div><div class="inv-row" style="color:#34c759;"><span>ADVANCE PAID</span><strong>- ₹${c.advance}</strong></div><div class="inv-total-row"><span>PENDING DUE</span><span>₹${c.pending}</span></div></div></div>`; 
        generateAndDownloadHDImage(content, `Receipt_${c.name.replace(/\s+/g, '_')}`); 
    };

    window.formatTimeAMPM = function(timeStr) { if(!timeStr) return '--'; let [h, m] = timeStr.split(':'); let hours = parseInt(h); let ampm = hours >= 12 ? 'PM' : 'AM'; hours = hours % 12; hours = hours ? hours : 12; return `${hours}:${m} ${ampm}`; };

    window.exportWorkerImage = function(id) { 
        const w = window.appData.workers.find(x => x.id === id); if(!w) return; let historyHTML = ''; 
        if(w.history && w.history.length > 0) { w.history.forEach(h => { let hColor = h.status === 'PRESENT' ? '#16a34a' : h.status === 'HALF DAY' ? '#ca8a04' : h.status === 'ABSENT' ? '#dc2626' : '#8e8e93'; historyHTML += `<tr><td>${h.date}</td><td style="color:${hColor}; font-weight:bold;">${h.status}</td><td>${formatTimeAMPM(h.timeIn)}</td><td>${formatTimeAMPM(h.timeOut)}</td><td style="color:#007aff; font-weight:bold;">₹${h.adv}</td></tr>`; }); } else { let sColor = w.status === 'PRESENT' ? '#16a34a' : w.status === 'HALF DAY' ? '#ca8a04' : w.status === 'ABSENT' ? '#dc2626' : '#8e8e93'; historyHTML = `<tr><td>${w.date}</td><td style="color:${sColor}; font-weight:bold;">${w.status}</td><td>${formatTimeAMPM(w.timeIn)}</td><td>${formatTimeAMPM(w.timeOut)}</td><td style="color:#007aff; font-weight:bold;">₹${w.advance}</td></tr>`; } 
        const content = `<div style="width: 100%; border: 3px solid #007aff; border-radius: 12px; padding: 25px; text-align: center; background:#ffffff;"><p style="font-size: 20px; color:#007aff; font-weight:800; margin-bottom: 5px; text-transform:uppercase;">WORKER FULL REPORT</p><p style="font-size: 18px; color:#333; margin-bottom: 15px; font-weight:700;">${w.name.toUpperCase()}</p><hr style="border-top:1px solid #007aff; margin-bottom:20px;"><div style="text-align: left; font-size: 16px; margin-bottom: 20px; font-weight:700; color:#000;">TOTAL ADVANCE TAKEN: <span style="color:#007aff;">₹${w.advance}</span></div><table class="export-table" style="width:100%; font-size: 12px; border-collapse: collapse; border: 2px solid #ddd;"><thead><tr><th style="background:#007aff; color:#fff; border: 1px solid #ddd;">DATE</th><th style="background:#007aff; color:#fff; border: 1px solid #ddd;">STATUS</th><th style="background:#007aff; color:#fff; border: 1px solid #ddd;">TIME IN</th><th style="background:#007aff; color:#fff; border: 1px solid #ddd;">TIME OUT</th><th style="background:#007aff; color:#fff; border: 1px solid #ddd;">ADV GIVEN</th></tr></thead><tbody>${historyHTML}</tbody></table></div>`; 
        generateAndDownloadHDImage(content, `Worker_Report_${w.name.replace(/\s+/g, '_')}`); 
    };

    window.exportDataImage = function(type) { 
        let tableHTML = '<tr>'; let title = ''; let filename = ''; 
        if(type === 'customers') { title = 'CUSTOMER RECORDS EXPORT'; filename = 'Customers_Data'; tableHTML += '<th style="background:#007aff; color:#fff;">DATE</th><th style="background:#007aff; color:#fff;">NAME</th><th style="background:#007aff; color:#fff;">MOBILE</th><th style="background:#007aff; color:#fff;">ITEM</th><th style="background:#007aff; color:#fff;">QTY</th><th style="background:#007aff; color:#fff;">RATE</th><th style="background:#007aff; color:#fff;">TOTAL AMT</th><th style="background:#007aff; color:#fff;">RECEIVED</th><th style="background:#007aff; color:#fff;">PENDING</th></tr>'; let tQty=0, tTotal=0, tRecv=0, tPend=0; window.appData.customers.forEach(c => { tableHTML += `<tr><td>${c.date}</td><td>${c.name}</td><td>${c.mobile}</td><td>${c.item}</td><td>${c.qty}</td><td>${c.rate}</td><td style="color:#0284c7; font-weight:bold;">${c.total}</td><td style="color:#16a34a; font-weight:bold;">${c.advance}</td><td style="color:#dc2626; font-weight:bold;">${c.pending}</td></tr>`; tQty+=c.qty; tTotal+=c.total; tRecv+=c.advance; tPend+=c.pending; }); tableHTML += `<tr style="font-weight: 900; background-color: #f8f9fa;"><td colspan="4" style="text-align:right; color:#000;">GRAND TOTAL:</td><td style="color:#0284c7;">${tQty}</td><td></td><td style="color:#0284c7;">${tTotal}</td><td style="color:#16a34a;">${tRecv}</td><td style="color:#dc2626;">${tPend}</td></tr>`; } 
        else if(type === 'expenses') { title = 'EXPENSE RECORDS EXPORT'; filename = 'Expenses_Data'; tableHTML += '<th style="background:#dc2626; color:#fff;">DATE</th><th style="background:#dc2626; color:#fff;">EXPENSE TYPE</th><th style="background:#dc2626; color:#fff;">AMOUNT</th></tr>'; let tAmt=0; window.appData.expenses.forEach(e => { tableHTML += `<tr><td>${e.date}</td><td>${e.type}</td><td style="color:#dc2626; font-weight:bold;">${e.amount}</td></tr>`; tAmt+=e.amount; }); tableHTML += `<tr style="font-weight: 900; background-color: #f8f9fa;"><td colspan="2" style="text-align:right; color:#000;">TOTAL EXPENSES:</td><td style="color:#dc2626;">${tAmt}</td></tr>`; } 
        else if(type === 'workers') { title = 'WORKERS ATTENDANCE EXPORT'; filename = 'Workers_Data'; tableHTML += '<th style="background:#ca8a04; color:#fff;">DATE</th><th style="background:#ca8a04; color:#fff;">NAME</th><th style="background:#ca8a04; color:#fff;">STATUS</th><th style="background:#ca8a04; color:#fff;">TIME IN</th><th style="background:#ca8a04; color:#fff;">TIME OUT</th><th style="background:#ca8a04; color:#fff;">ADVANCE</th></tr>'; window.appData.workers.forEach(w => { let sColor = w.status === 'PRESENT' ? '#16a34a' : w.status === 'HALF DAY' ? '#ca8a04' : w.status === 'ABSENT' ? '#dc2626' : '#8e8e93'; tableHTML += `<tr><td>${w.date}</td><td>${w.name}</td><td style="color:${sColor}; font-weight:bold;">${w.status}</td><td>${formatTimeAMPM(w.timeIn)}</td><td>${formatTimeAMPM(w.timeOut)}</td><td style="color:#007aff; font-weight:bold;">${w.advance}</td></tr>`; }); } 
        const content = `<div style="width: 100%;"><h2 class="export-title">${title}</h2><table class="export-table">${tableHTML}</table></div>`; setTimeout(() => { generateAndDownloadHDImage(content, filename); }, 350); 
    };
</script>
</body>
